<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="60%" stop-color="#0b0d13"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <linearGradient id="redBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff333e"/>
      <stop offset="55%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#99000a"/>
    </linearGradient>

    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="50%" stop-color="rgba(229,9,20,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="150" fill="#e50914" opacity="0.18"/>

  <!-- Monogram B (Spine + Loops) -->
  <!-- Left Vertical Spine -->
  <rect x="136" y="124" width="60" height="264" rx="28" fill="url(#redBrandGrad)"/>

  <!-- Upper Loop -->
  <path d="M 180 124 L 295 124 C 352 124 394 158 394 206 C 394 246 360 274 314 280 L 180 280 Z" fill="url(#redBrandGrad)"/>
  
  <!-- Lower Loop -->
  <path d="M 180 248 L 324 248 C 382 248 424 284 424 336 C 424 388 376 422 310 422 L 180 422 Z" fill="url(#redBrandGrad)"/>

  <!-- Inner Negative Space -->
  <path d="M 196 164 L 285 164 C 322 164 344 182 344 206 C 344 228 322 244 285 244 L 196 244 Z" fill="#0b0d13"/>
  <path d="M 196 284 L 302 284 C 344 284 372 306 372 336 C 372 366 344 386 302 386 L 196 386 Z" fill="#0b0d13"/>

  <!-- Dynamic Play Triangle in Center -->
  <polygon points="234,222 234,290 292,256" fill="#ffffff"/>

  <!-- Specular Sheen Reflection -->
  <path d="M 20 138 C 20 74 74 20 138 20 L 374 20 C 438 20 492 74 492 138 C 430 156 340 168 256 168 C 172 168 82 156 20 138 Z" fill="url(#sheenGrad)"/>
</svg>